openapi: 3.0.3
info:
  title: Kronan Public API
  version: 1.0.0
  description: |
    Public API for Kronan SmartStore.

    This API is designed for external systems, mobile apps, and third-party integrations to interact with the Kronan e-commerce platform.

    This API is in BETA and in active development.

    ## Authentication
    All endpoints require an `AccessToken` header: `Authorization: AccessToken <token>`.
    Tokens are scoped to a user or a customer group.

    Only Users with login type Audkenni can create access tokens.

    Access tokens can be created in settings in User or Customer group pages.

    ## Available resources
    - **Me** — Current authenticated identity (user or customer group)
    - **Products** — Browse products, search in smart store product selection, view details
    - **Categories** — Category tree and paginated product listings
    - **Orders** — Order history, details, and line modifications
    - **Checkout** — Smart checkout with line management
    - **Shopping Notes** — Freeform shopping lists with product linking. Used in Scan and Go
    Note: App does not support SKUs in notes yet.
    - **Product Lists** — Saved product collections
    - **Purchase Stats** — Personal purchase history and frequency data

    ## Coming soon
    - Delivery slot browsing and reservation
    - Address management
    - Payment initiation with gift cards as we can't integrate with 3DS programmatically
    - Special search for shopping notes to be able to search for all products in certain stores

    ## Rate limiting
    All endpoints are rate limited to 200 requests per 200 seconds per user. Exceeding the limit returns `429 Too Many Requests`.

    ## Conventions
    - All monetary values are integers (ISK, no decimals)
    - Timestamps are ISO-8601 UTC with trailing `Z`
    - Empty arrays return `[]`, never `null`
    - Paginated endpoints use `limit`/`offset` parameters
    - Response field names are `camelCase`
paths:
  /api/v1/categories/:
    get:
      operationId: categories_list
      description: Returns the full category tree (3 levels).
      summary: List categories
      tags:
      - categories
      security:
      - AccessTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicCategory'
          description: ''
  /api/v1/categories/{slug}/products/:
    get:
      operationId: categories_products_retrieve
      description: Returns a paginated product listing for a category (48 products
        per page).
      summary: Get category products
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: 'Page number (default: 1)'
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - categories
      security:
      - AccessTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCategoryProductList'
          description: ''
  /api/v1/checkout/:
    get:
      operationId: checkout_list
      description: Returns the active smart checkout for the authenticated user or
        customer group. A checkout is auto-created if none exists.
      summary: Get active checkout
      tags:
      - checkout
      security:
      - AccessTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicCheckout'
          description: ''
  /api/v1/checkout/lines/:
    post:
      operationId: checkout_lines_create
      description: 'Add product lines to the active checkout. Set `replace: true`
        to replace all existing lines. Each line requires a SKU and quantity. Products
        are validated for availability'
      summary: Add or replace checkout lines
      tags:
      - checkout
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublicLinesAddInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicLinesAddInput'
          application/json:
            schema:
              $ref: '#/components/schemas/PublicLinesAddInput'
        required: true
      security:
      - AccessTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCheckout'
          description: ''
  /api/v1/me/:
    get:
      operationId: me_list
      description: Returns the identity behind the access token. `type` is either
        `user` or `customer_group`. `name` is the user's full name or the customer
        group name.
      summary: Get current identity
      tags:
      - me
      security:
      - AccessTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicMe'
          description: ''
  /api/v1/orders/:
    get:
      operationId: orders_list
      description: Returns a paginated list of orders ordered by most recent first.
      summary: List orders
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: string
        description: 'Filter by order type: delivery, pickup, scan_n_go, digital'
      tags:
      - orders
      security:
      - AccessTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicOrderListResponseList'
          description: ''
  /api/v1/orders/{token}/:
    get:
      operationId: orders_retrieve
      description: Returns full order details including lines with product thumbnails.
      summary: Get order details
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - orders
      security:
      - AccessTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOrder'
          description: ''
  /api/v1/orders/{token}/delete-lines/:
    post:
      operationId: orders_delete_lines_create
      description: Remove specific lines from an order by their IDs. Service lines
        and the last remaining line cannot be deleted. Lines where picking has started
        are also protected. Returns the updated order.
      summary: Delete order lines
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublicLinesDeleteInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicLinesDeleteInput'
          application/json:
            schema:
              $ref: '#/components/schemas/PublicLinesDeleteInput'
        required: true
      security:
      - AccessTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOrder'
          description: ''
  /api/v1/orders/{token}/lines-toggle-substitution/:
    post:
      operationId: orders_lines_toggle_substitution_create
      description: Toggle whether substitution is allowed for specific order lines.
        Only works on orders where modifications are still allowed. Returns the updated
        order.
      summary: Toggle substitution on order lines
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublicLinesToggleSubstitutionInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicLinesToggleSubstitutionInput'
          application/json:
            schema:
              $ref: '#/components/schemas/PublicLinesToggleSubstitutionInput'
        required: true
      security:
      - AccessTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOrder'
          description: ''
  /api/v1/orders/{token}/lower-quantity-lines/:
    post:
      operationId: orders_lower_quantity_lines_create
      description: Reduce the quantity of specific order lines. Quantity can only
        be lowered, not increased. Set to 0 to remove the line. Lines where picking
        has started cannot be modified. Returns the updated order.
      summary: Lower quantity on order lines
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublicLinesLowerQuantityInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicLinesLowerQuantityInput'
          application/json:
            schema:
              $ref: '#/components/schemas/PublicLinesLowerQuantityInput'
        required: true
      security:
      - AccessTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOrder'
          description: ''
  /api/v1/product-lists/:
    get:
      operationId: product_lists_list
      description: Returns a paginated list of product lists owned by the authenticated
        user or customer group.
      summary: List product lists
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - product-lists
      security:
      - AccessTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicProductListListResponseList'
          description: ''
    post:
      operationId: product_lists_create
      description: Create a new product list with an optional name and description.
      summary: Create product list
      tags:
      - product-lists
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublicProductListCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicProductListCreate'
          application/json:
            schema:
              $ref: '#/components/schemas/PublicProductListCreate'
        required: true
      security:
      - AccessTokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProductList'
          description: ''
  /api/v1/product-lists/{token}/:
    get:
      operationId: product_lists_retrieve
      description: Returns a product list with all items including product details,
        pricing, discounts.
      summary: Get product list details
      parameters:
      - in: path
        name: token
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - product-lists
      security:
      - AccessTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProductListDetail'
          description: ''
    patch:
      operationId: product_lists_partial_update
      description: Update the name or description of a product list.
      summary: Update product list
      parameters:
      - in: path
        name: token
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - product-lists
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPublicProductListCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPublicProductListCreate'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPublicProductListCreate'
      security:
      - AccessTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProductList'
          description: ''
    delete:
      operationId: product_lists_destroy
      description: Permanently delete a product list and all its items.
      summary: Delete product list
      parameters:
      - in: path
        name: token
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - product-lists
      security:
      - AccessTokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/product-lists/{token}/delete-all-items/:
    delete:
      operationId: product_lists_delete_all_items_destroy
      description: Remove all items from a product list without deleting the list
        itself.
      summary: Delete all items from product list
      parameters:
      - in: path
        name: token
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - product-lists
      security:
      - AccessTokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/product-lists/{token}/sort-items/:
    post:
      operationId: product_lists_sort_items_create
      description: Sort items in the product list by store departments. Returns the
        updated list.
      summary: Sort product list items
      parameters:
      - in: path
        name: token
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - product-lists
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublicProductList'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicProductList'
          application/json:
            schema:
              $ref: '#/components/schemas/PublicProductList'
        required: true
      security:
      - AccessTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProductListDetail'
          description: ''
  /api/v1/product-lists/{token}/update-item/:
    post:
      operationId: product_lists_update_item_create
      description: Add a product by SKU or update its quantity. Set quantity to 0
        to remove the item. Returns the updated list with full product details.
      summary: Add or update item in product list
      parameters:
      - in: path
        name: token
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - product-lists
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublicProductListAddItemInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicProductListAddItemInput'
          application/json:
            schema:
              $ref: '#/components/schemas/PublicProductListAddItemInput'
        required: true
      security:
      - AccessTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProductListDetail'
          description: ''
  /api/v1/product-purchase-stats/:
    get:
      operationId: product_purchase_stats_list
      description: Returns a paginated list of products the user or customer group
        has previously purchased, ordered by most recent purchase date. Ignored products
        are excluded by default.
      summary: List purchase history
      parameters:
      - in: query
        name: include_ignored
        schema:
          type: boolean
        description: Set to true to include ignored products in the results.
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - product-purchase-stats
      security:
      - AccessTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicProductPurchaseStatsListResponseList'
          description: ''
  /api/v1/product-purchase-stats/{id}/set-ignored/:
    patch:
      operationId: product_purchase_stats_set_ignored_partial_update
      description: Set whether a product is hidden from purchase history. Ignored
        products will not appear in the default list.
      summary: Set ignored status
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this product purchase stats
          v2.
        required: true
      tags:
      - product-purchase-stats
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPublicToggleIgnoredInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPublicToggleIgnoredInput'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPublicToggleIgnoredInput'
      security:
      - AccessTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProductPurchaseStats'
          description: ''
  /api/v1/products/{sku}/:
    get:
      operationId: products_retrieve
      description: Returns full product details including price, discounts, tags,
        availability.
      summary: Get product details
      parameters:
      - in: path
        name: sku
        schema:
          type: string
        description: Product SKU
        required: true
      tags:
      - products
      security:
      - AccessTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProductDetail'
          description: ''
  /api/v1/products/search/:
    post:
      operationId: products_search_create
      description: 'Search for products with pagination and sorting. Only returns
        products in the smart store product selection that are available for home
        delivery. Set `with_detail: true` for enriched results including discounts
        and tags.'
      summary: Search products
      tags:
      - products
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublicSearchInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicSearchInput'
          application/json:
            schema:
              $ref: '#/components/schemas/PublicSearchInput'
        required: true
      security:
      - AccessTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPaginatedSearchResult'
          description: ''
  /api/v1/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - de
          - en
          - is
          - nb
          - sv
      tags:
      - schema
      security:
      - AccessTokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/shopping-notes/:
    get:
      operationId: shopping_notes_list
      description: Returns the shopping note for the authenticated user or customer
        group. Auto-creates one if none exists.
      summary: Get shopping note
      tags:
      - shopping-notes
      security:
      - AccessTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicShoppingNote'
          description: ''
  /api/v1/shopping-notes/add-line/:
    post:
      operationId: shopping_notes_add_line_create
      description: Add a new line to the shopping note. Provide either a `text` (freeform
        item) or a `sku` (linked product), with an optional quantity.
      summary: Add line to shopping note
      tags:
      - shopping-notes
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublicShoppingNoteLineInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicShoppingNoteLineInput'
          application/json:
            schema:
              $ref: '#/components/schemas/PublicShoppingNoteLineInput'
      security:
      - AccessTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicShoppingNote'
          description: ''
  /api/v1/shopping-notes/change-line/:
    patch:
      operationId: shopping_notes_change_line_partial_update
      description: Update the text or quantity of an existing shopping note line.
      summary: Change shopping note line
      tags:
      - shopping-notes
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPublicShoppingNoteLineChangeInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPublicShoppingNoteLineChangeInput'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPublicShoppingNoteLineChangeInput'
      security:
      - AccessTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicShoppingNote'
          description: ''
  /api/v1/shopping-notes/change-placement/:
    patch:
      operationId: shopping_notes_change_placement_partial_update
      description: Change the display order of lines by passing their tokens in the
        desired order via `lines_tokens` query parameter.
      summary: Reorder shopping note lines
      parameters:
      - in: query
        name: lines_tokens
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: true
        explode: true
      tags:
      - shopping-notes
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPublicShoppingNote'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPublicShoppingNote'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPublicShoppingNote'
      security:
      - AccessTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicShoppingNote'
          description: ''
  /api/v1/shopping-notes/delete-line/:
    delete:
      operationId: shopping_notes_delete_line_destroy
      description: Remove a line from the shopping note by its token.
      summary: Delete shopping note line
      parameters:
      - in: query
        name: token
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - shopping-notes
      security:
      - AccessTokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/shopping-notes/delete-line-archived/:
    delete:
      operationId: shopping_notes_delete_line_archived_destroy
      description: Remove a specific archived line by its token. Returns the remaining
        archived lines.
      summary: Delete archived line
      parameters:
      - in: query
        name: token
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - shopping-notes
      security:
      - AccessTokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/shopping-notes/delete-shopping-note/:
    delete:
      operationId: shopping_notes_delete_shopping_note_destroy
      description: Delete all lines from the shopping note (the note itself is preserved).
      summary: Clear shopping note
      tags:
      - shopping-notes
      security:
      - AccessTokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/shopping-notes/is-eligible-for-store-product-order/:
    get:
      operationId: shopping_notes_is_eligible_for_store_product_order_retrieve
      description: Check if the shopping note contains products that can be ordered
        from a store. Returns 204 if eligible, 404 if no matching products found.
      summary: Check store product order eligibility
      tags:
      - shopping-notes
      security:
      - AccessTokenAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicShoppingNoteEligibilityError'
          description: ''
  /api/v1/shopping-notes/lines-archived/:
    get:
      operationId: shopping_notes_lines_archived_list
      description: Returns previously completed and archived shopping note lines.
      summary: List archived lines
      tags:
      - shopping-notes
      security:
      - AccessTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicShoppingNoteLineArchived'
          description: ''
  /api/v1/shopping-notes/store-product-order/:
    post:
      operationId: shopping_notes_store_product_order_create
      description: Reorder shopping note lines to match the store's product aisle
        layout for efficient in-store shopping.
      summary: Apply store product order
      tags:
      - shopping-notes
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublicShoppingNote'
          multipart/form-data:
            schema:
